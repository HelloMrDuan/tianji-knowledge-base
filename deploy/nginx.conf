# Static frontend + /api reverse proxy. TLS is terminated at the outer gateway.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy (same-origin for the frontend).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # SPA fallback; real asset paths still resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve hidden files or backups.
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
}
