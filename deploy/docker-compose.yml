# Tianji v0.1 sealed-runtime deployment (controlled environment).
#
# The sealed bundle is built OUTSIDE the image on the deploy machine:
#   python scripts/export_sealed_runtime.py --destination /sealed
# which prints {"sha256_pin": "<64-hex>", ...}. Mount it read-only and pass
# the pin through. The image contains no code, no knowledge, no secrets.
# TLS termination happens at the gateway (see RUNBOOK.md).
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TIANJI_RUNTIME_MODE: sealed
      TIANJI_RUNTIME_ROOT: /sealed
      TIANJI_RUNTIME_SHA256: ${TIANJI_RUNTIME_SHA256:?set TIANJI_RUNTIME_SHA256 from export_sealed_runtime.py}
      TIANJI_AI_PROVIDER: disabled
      # TIANJI_ADMIN_READ_TOKEN must come from the secret store, never compose.
    volumes:
      - ${TIANJI_SEALED_DIR:?set TIANJI_SEALED_DIR to the exported bundle}:/sealed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
