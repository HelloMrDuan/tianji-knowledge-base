# Tianji v0.1 restricted-internal deployment (controlled environment).
# Private knowledge is mounted read-only at runtime; never baked into images.
# TLS termination happens at the gateway (see RUNBOOK.md); this file is HTTP-only.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TIANJI_AI_PROVIDER: disabled
      TIANJI_RUNTIME_MODE: sealed
      # TIANJI_ADMIN_READ_TOKEN must come from the secret store, never compose.
    volumes:
      # Private knowledge mount (read-only). Path set by the operator.
      - ${TIANJI_PRIVATE_DATA_DIR:?set TIANJI_PRIVATE_DATA_DIR}:/private-data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
