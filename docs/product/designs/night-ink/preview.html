<header class="topbar"><a class="logo" href="#home">天机命理<span>观天之道 · 知人之命</span></a><nav class="links" aria-label="主导航"><a href="#home">首页</a><a href="#scenes">命理测算</a><a href="#scenes">文化百科</a><a href="#scenes">我的记录</a></nav><div class="actions"><div class="music-holder"><button class="frame-button music-button" id="musicTrigger" aria-label="古风背景音乐设置" aria-expanded="false" aria-controls="musicPanel"><span class="sound-wave">♫</span>古风音乐 <span class="music-indicator" id="musicIndicator"></span></button><div class="music-panel" id="musicPanel" hidden><h3>静水弦音</h3><p id="musicMessage">默认静音，点击播放后欣赏古风音律。</p><div class="music-row"><button id="playPause" aria-label="播放背景音乐">▶ 播放</button><label for="musicVolume">音量</label><input id="musicVolume" type="range" aria-label="背景音乐音量" min="0" max="100" value="25" step="5"/><span id="volumeText" class="play-state">25%</span></div></div></div><a class="frame-button" href="#scenes">进入测算</a></div></header>

0v23" stroke="#6f3b1d" stroke-width="4"/><rect x="422" y="120" width="40" height="90" rx="10" fill="#f1a44e" opacity=".25" filter="url(#glow)"/><rect x="427" y="129" width="30" height="64" rx="10" fill="#efad5b"/></g><g stroke="#562a23" stroke-width="7" fill="none"><path d="M1350 0q-110 62-210 56-110 0-187 99M1295 32l40 80m-124-68l-40 63M1102 66l15 59"/><path d="M180 0q80 70 170 75m-95-49l40 64"/></g><g fill="#cb6262"><circle cx="1090" cy="85" r="7"/><circle cx="1152" cy="69" r="6"/><circle cx="1220" cy="80" r="7"/><circle cx="1270" cy="135" r="7"/><circle cx="1329" cy="104" r="5"/><circle cx="332" cy="70" r="8"/><circle cx="279" cy="57" r="5"/></g><path d="M28 650h1440v100H0Z" fill="#071117" opacity=".7"/></svg><div class="hero-shade"></div><div class="hero-copy"><div class="eyebrow">华夏术数 · 古籍为证</div><h1>天机命理 <span class="seal">天机</span></h1><div class="caption">观天之道 · 知人之命</div><p>以传统命理为镜，观岁月流转。<br>从今日、桃花到事业，于古卷山水间探索人生脉络。</p></div><div class="feature-grid" id="featured"></div><div class="coin-nav" id="quickNav"></div></section><section class="lower" id="scenes"><div class="inner"><div class="section-title"><h2>命理测算</h2><span>以真实计算结构与已核验内容为依据</span></div><div class="scenes" id="sceneList"></div><section class="report" id="report" aria-live="polite"></section><p class="footnote">本页是独立的视觉交互设计原型，尚未接入测算 API。正式页面仅从真实接口呈现结果。</p></div></section></main><nav class="bottom-nav" aria-label="手机底部导航"><button data-target="home"><span>⌂</span>首页</button><button data-target="scenes"><span>☯</span>测算</button><button data-target="scenes"><span>▤</span>记录</button><button data-target="scenes"><span>♙</span>我的</button></nav>

<script>
const scenes=[
{id:'daily',name:'今日运势',glyph:'日',caption:'观当日干支，察时间脉络',scope:'展示目标日干支、与日主对应的十神及两套咸池日支命中',art:'mountain',main:true},
{id:'romance',name:'桃花姻缘',glyph:'缘',caption:'看传统桃花结构',scope:'依年支与日支分别检索咸池条件，呈现原局及选定年份的命中结构',art:'blossom',main:true},
{id:'career',name:'事业财运',glyph:'业',caption:'察财官印食伤结构',scope:'分项展示正偏财、官杀、食伤、印星及比劫位置与目标年十神',art:'horse',main:true},
{id:'yearly',name:'流年运势',glyph:'年',caption:'看选定年份的干支结构',scope:'展示用户选择年份的干支及其相对日主的十神结构',art:'mountain',main:true},
{id:'bazi',name:'八字基础',glyph:'☯',caption:'识四柱、日主与十神',scope:'依据已审历法和规则展示年、月、日、时四柱与藏干、十神',art:'mountain'},
{id:'question',name:'一事占问',glyph:'卦',caption:'六爻排盘，探一事',scope:'根据六次起卦记录生成本卦、动爻、变卦及已核验结构',art:'scroll'},
{id:'compatibility',name:'缘分合盘',glyph:'合',caption:'双人四柱结构对照',scope:'展示双方四柱、天干五合及地支合冲害等结构对照，不以命中次数换算分数',art:'blossom'},
{id:'life',name:'人生总览',glyph:'命',caption:'汇合已有基础结构',scope:'汇总八字基础、流年、桃花、事业财运的现有事实信息，不生成新的个人吉凶断语',art:'mountain'},
{id:'dream',name:'传统梦象',glyph:'梦',caption:'寻梦中意象的古籍短引',scope:'输入具体梦境后，仅匹配经过审核的特定梦象条目及短引',art:'scroll'},
{id:'weekly',name:'本周运势',glyph:'周',caption:'逐日看七日干支',scope:'按周一至周日展示七日干支及十神结构',art:'mountain'},
{id:'monthly',name:'本月运势',glyph:'月',caption:'纵览一月的日结构',scope:'逐日展开公历自然月的干支、十神结构与汇总',art:'mountain'}
];
function art(kind){const common='<path d="M0 92Q36 61 69 81 92 41 114 65 142 8 182 59 210 30 249 67 270 45 295 80V115H0Z" fill="#68949a" opacity=".6"/><path d="M0 104Q28 78 55 100 110 67 145 98 204 65 247 101 281 89 305 110V130H0Z" fill="#355e67" opacity=".75"/>';let extra=kind==='blossom'?'<path d="M120 130Q137 75 164 40Q185 19 215 18M152 63Q128 43 108 35M182 34Q179 14 181 5" stroke="#6f443e" stroke-width="6" fill="none"/><g fill="#d47a81"><circle cx="211" cy="24" r="11"/><circle cx="177" cy="15" r="8"/><circle cx="112" cy="34" r="10"/><circle cx="167" cy="42" r="13"/><circle cx="138" cy="57" r="9"/></g>':kind==='horse'?'<path d="M100 77l28-33 26-5 19 27 29 8 12 14-19 8-34-7-11 31-10 0-4-29-22 6-10 23h-10l5-39-23-14Z" fill="#343633"/><path d="M153 46l-7-25m24 45 16-20" stroke="#353330" stroke-width="5"/>':kind==='scroll'?'<g fill="#9f7650" stroke="#664a30" stroke-width="2"><rect x="101" y="35" width="91" height="65" rx="4"/><path d="M108 29v78m82-78v78" stroke-width="6"/><path d="M120 49h60M120 60h60M120 71h40" stroke="#e6d0a0"/></g>':'';return `<svg viewBox="0 0 300 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="222" cy="43" r="26" fill="#ec9860" opacity=".85"/>${common}${extra}</svg>`}
function addSceneCard(s,index){return `<button class="scene-item" data-open="${s.id}"><span class="scene-glyph">${s.glyph}</span><span><strong>${s.name}</strong><small>${s.caption}</small></span></button>`}
document.querySelector('#featured').innerHTML=scenes.filter(s=>s.main).map(s=>`<article class="scroll-card" role="button" tabindex="0" data-open="${s.id}" aria-label="查看${s.name}设计"><div class="card-art">${art(s.art)}<span class="stamp">${s.glyph}</span></div><div class="card-text"><strong>${s.name}</strong><small>${s.caption}</small></div><span class="enter">进入查看 →</span></article>`).join('');
document.querySelector('#quickNav').innerHTML=scenes.filter(s=>!s.main).slice(0,7).map(s=>`<button data-open="${s.id}"><span class="coin">${s.glyph}</span>${s.name}</button>`).join('');
document.querySelector('#sceneList').innerHTML=scenes.map(addSceneCard).join('');
function openScene(id){const s=scenes.find(x=>x.id===id);if(!s)return;const panel=document.querySelector('#report');panel.classList.add('active');panel.innerHTML=`<button class="report-back" id="closeReport">← 返回全部场景</button><div class="eyebrow" style="color:#94582c">天机命理 · 场景设计</div><h2>${s.name}</h2><p class="report-sub">${s.caption}</p><div class="report-columns"><div class="report-panel"><h3>输入资料</h3><p>正式开发时按该场景实际输入契约展示必要字段，校验通过后才能请求真实服务。</p><button disabled title="视觉设计稿不执行测算" style="opacity:.65;cursor:not-allowed">查看计算结果</button></div><div class="report-panel"><h3>结果展示内容</h3><p>${s.scope}。</p><p>没有接口响应时不显示任何模拟的个人数值、命盘或好运评分。</p></div></div>`;panel.scrollIntoView({behavior:'smooth',block:'start'});document.querySelector('#closeReport').onclick=()=>{panel.classList.remove('active');document.querySelector('#scenes').scrollIntoView({behavior:'smooth'})}}
document.addEventListener('click',e=>{const node=e.target.closest('[data-open]');if(node)openScene(node.getAttribute('data-open'));const nav=e.target.closest('[data-target]');if(nav)document.getElementById(nav.dataset.target)?.scrollIntoView({behavior:'smooth'})});document.addEventListener('keydown',e=>{const a=e.target.closest('article[data-open]');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openScene(a.dataset.open)}});
const trigger=document.getElementById('musicTrigger'),panel=document.getElementById('musicPanel'),audio=document.getElementById('bgMusic'),toggle=document.getElementById('playPause'),volume=document.getElementById('musicVolume'),msg=document.getElementById('musicMessage'),indicator=document.getElementById('musicIndicator'),volumeText=document.getElementById('volumeText');
let opts={volume:25};try{const t=JSON.parse(localStorage.getItem('tianji.visual.music')||'{}');if(Number.isFinite(t.volume))opts.volume=Math.max(0,Math.min(100,t.volume))}catch{}audio.volume=opts.volume/100;volume.value=opts.volume;volumeText.textContent=opts.volume+'%';
function syncAudio(){toggle.textContent=audio.paused?'▶ 播放':'Ⅱ 暂停';toggle.setAttribute('aria-label',audio.paused?'播放背景音乐':'暂停背景音乐');indicator.classList.toggle('playing',!audio.paused);if(!audio.paused)msg.textContent='正在播放 · 切换设计场景音乐不会中断。'}
trigger.onclick=()=>{panel.hidden=!panel.hidden;trigger.setAttribute('aria-expanded',String(!panel.hidden))};toggle.onclick=async()=>{if(!audio.paused){audio.pause();msg.textContent='已暂停。';return}try{await audio.play();msg.textContent='正在播放 · 静水弦音'}catch{msg.textContent='音轨未加载：请从完整仓库根目录启动本设计页。'}};volume.oninput=()=>{const v=Number(volume.value);audio.volume=v/100;volumeText.textContent=v+'%';try{localStorage.setItem('tianji.visual.music',JSON.stringify({volume:v}))}catch{}};audio.addEventListener('play',syncAudio);audio.addEventListener('pause',syncAudio);audio.addEventListener('error',()=>msg.textContent='无法加载现有音轨，请确认仓库中的 quiet-waters.ogg 路径。');
</script></body></html>
