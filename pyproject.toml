[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tianji-knowledge-base"
version = "0.1.0"
description = "Provenance-first traditional Chinese culture and metaphysics knowledge base"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]
