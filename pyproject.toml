[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tianji-knowledge-base"
version = "0.1.0"
description = "Provenance-first traditional Chinese culture and metaphysics knowledge base"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
validation = ["jsonschema>=4.18,<5"]
calendar = ["lunar-python==1.4.8", "tzdata>=2024.1; sys_platform == 'win32'"]
api = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
