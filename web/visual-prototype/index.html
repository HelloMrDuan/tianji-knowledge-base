<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1c23" />
    <title>天机 · 观象循理</title>
    <!-- TJ-008.6：首屏绘制前应用主题偏好，避免闪烁；深青夜景为默认 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tianji.theme");
          if (t !== "night" && t !== "paper") t = "night";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "night");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
