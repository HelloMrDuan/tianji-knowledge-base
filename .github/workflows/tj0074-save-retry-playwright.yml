name: TJ-007.4 Save Cross-page Error Browser Regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tj0074-save-retry-playwright.yml"
      - "web/visual-prototype/**"
      - "docs/product/TASK_STATUS.md"
      - "docs/product/TASK_HISTORY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tj0074-front-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/visual-prototype/package-lock.json
      - name: Install dependencies
        working-directory: web/visual-prototype
        run: npm ci
      - name: Install Chromium
        working-directory: web/visual-prototype
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium saved-profile, history, error/retry, race and privacy tests (stubbed API)
        working-directory: web/visual-prototype
        run: CI=true npm test -- tests/tj0074-library-retry.spec.ts tests/tj0062-race-condition.spec.ts tests/tj0063-privacy.spec.ts
      - name: Run legacy example-history and favorites regression
        working-directory: web/visual-prototype
        run: CI=true npm test -- tests/prototype.spec.ts tests/whole-site.spec.ts --grep "sample favorites persist|library filtering"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tj0074-browser-test-results
          path: web/visual-prototype/test-results/
          retention-days: 3
