name: TJ-006.2 Frontend State Playwright

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tj0062-frontend-state-playwright.yml"
      - "web/visual-prototype/**"
      - "docs/product/TASK_STATUS.md"
      - "docs/product/TASK_HISTORY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-state-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/visual-prototype/package-lock.json
      - name: Install frontend dependencies
        working-directory: web/visual-prototype
        run: npm ci
      - name: Install Chromium
        working-directory: web/visual-prototype
        run: npx playwright install --with-deps chromium
      - name: Verify frontend state contracts (controlled API replies; no real calculations)
        working-directory: web/visual-prototype
        run: CI=true npm test -- tests/tj0062-race-condition.spec.ts
