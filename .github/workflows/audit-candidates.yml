name: Audit Discovered Sources

on:
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit licenses and repository health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_candidates.py --limit 100
      - name: Commit audit results
        shell: bash
        run: |
          if git diff --quiet -- data/registry/discovered_candidates.json; then exit 0; fi
          git config user.name "tianji-kb-bot"
          git config user.email "tianji-kb-bot@users.noreply.github.com"
          git add data/registry/discovered_candidates.json
          git commit -m "chore: audit discovered source licenses"
          git push
