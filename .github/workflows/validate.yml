name: Validate Public Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -p 'test_public_asset_changes.py'
      - run: python -m unittest discover -s tests -p 'test_public_knowledge_boundary.py'
      - run: python -m unittest discover -s tests -p 'test_public_web_bundle.py'
      - run: python scripts/audit_public_asset_changes.py --inventory
