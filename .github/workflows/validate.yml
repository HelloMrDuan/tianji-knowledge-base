name: Validate Public Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -p 'test_public_asset_changes.py'
      - run: python -m unittest discover -s tests -p 'test_public_knowledge_boundary.py'
      - run: python -m unittest discover -s tests -p 'test_public_web_bundle.py'
      - run: python -m unittest discover -s tests -p 'test_offline_acceptance.py'
      - run: python -m unittest discover -s tests -p 'test_health_check.py' -v
      # Pure narrative parser regression: no private Canonical/RAG data required.
      # This MUST execute test assertions, not just compileall.
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b004_public_parser_contract.py' -v
      # B012 public execution gate + projection contract: no private
      # Canonical/RAG data required. This MUST execute test assertions,
      # not just compileall. Real-engine tests live in
      # test_b012_tools_engine.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b012_tools_public.py' -v
      # B014 public execution gate + projection contract for ziwei/qimen/
      # fengshui: same rule. Real-engine tests live in
      # test_b014_tools_engine.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b014_tools_public.py' -v
      # B016 admin read-scope decision matrix (pure stdlib, no FastAPI or
      # private data). HTTP-level verification lives in
      # test_b016_admin_scope_http.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b016_admin_scope.py' -v
      # B016 Scenario gate tables pinned to reality (registry ids, router
      # routes, spec files on disk). Pure file parsing, no data required.
      - run: python -m unittest discover -s tests -p 'test_b016_scenario_gate_table.py' -v
      # B018 admin role decision matrix + append-only audit log (pure
      # stdlib, no FastAPI or private data). HTTP-level verification
      # lives in test_b018_admin_roles_http.py (offline acceptance only,
      # NOT public CI). Also includes the read-token env-fallback fix
      # regression (env-configured tokens must authenticate).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b018_admin_roles.py' -v
      # B020 draft approval state machine + action-to-role mapping
      # (pure stdlib, no FastAPI or private data). HTTP-level
      # verification lives in test_b020_drafts_http.py (offline
      # acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b020_drafts.py' -v
      # B022 draft version snapshots + rollback (pure stdlib, no
      # FastAPI or private data). HTTP-level verification lives in
      # test_b022_rollback_http.py (offline acceptance only, NOT
      # public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b022_rollback.py' -v
      # B018 dream demand matrix view contract (pure file parsing of the
      # DreamCulturePage matrix section, no backend or data required).
      - run: python -m unittest discover -s tests -p 'test_b018_dream_matrix.py' -v
      # F-1 timezone-aware birth calendar (lunar-python + zoneinfo only,
      # no private data or sealed runtime; scenario end-to-end coverage
      # lives in test_tz_scenario_offline.py, offline acceptance only).
      # F-1 test imports the production calendar library, which the code
      # job otherwise never installs (first CI test to import lunar_python).
      - run: python -m pip install 'lunar-python==1.4.8'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tz_birth_calendar.py' -v
      # TJ-031.6 solar-term attribution regression: year/month pillars and
      # solar_term_started_at follow the birth instant against the
      # provider's China-baseline jieqi table (expected values derived
      # independently via sxtwl/JPL anchors in tj0316-verify, NOT from
      # the code under test). Same partition as the F-1 test above.
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tz_solar_term_instant.py' -v
      # TJ-031.7 honest boundaries: 1900-1948 public-period gate
      # helpers + solar-term precision note. Same partition as the tz
      # tests above (lunar-python + zoneinfo + public_projection
      # only; HTTP wiring is exercised in offline acceptance).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0317_honest_boundaries.py' -v
      # TJ-031.5 public labeling contracts: evidence excerpt flags,
      # liuyao judgment scope annotation, dream source title resolved
      # from evidence records. Pure projection/record units (no
      # FastAPI, no private data); handler end-to-end coverage with
      # real records lives in test_public_dream_culture_api.py
      # (offline acceptance only, same partition rule as above).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0315_public_labels.py' -v
      # TJ-013.1 tiaohou (调候) public contracts: rule table vs Golden
      # transcription, pure lookup, engine research gate, forged-trace
      # rejection, public-projection strip. No sealed data needed.
      # Verbatim quote-vs-snapshot and real-chart coverage lives in
      # test_tj0131_tiaohou_sealed.py (offline acceptance only, NOT
      # public CI, same partition rule as the liuyao precedent).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0131_tiaohou.py' -v
      # TJ-013 bingyao (病药) public contracts: rule table vs Golden
      # transcription, pure lookup, never-a-verdict sweep, engine
      # research gate, forged-trace rejection, public-projection strip.
      # No sealed data needed. Verbatim quote-vs-snapshot and real-chart
      # coverage lives in test_tj013_bingyao_sealed.py (offline
      # acceptance only, NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj013_bingyao.py' -v
      # TJ-013.2 phase 1 (cross-system conflict presentation) public
      # contracts: Golden transcription, presenter relation taxonomy
      # over real tiaohou/bingyao lookups, forbidden-key sweep, engine
      # research gate, chart variant-combination gate, public-projection
      # strip. The strength statements fed to the presenter here are
      # synthetic (marked in the test); real-chart coverage with the
      # executed strength verdicts lives in
      # test_tj0132_conflict_presentation_sealed.py (offline acceptance
      # only, NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0132_conflict_presentation.py' -v
      # TJ-017.1 dayun classical-evidence public contracts: rule/quote
      # tables vs Golden transcription, text-derived direction and
      # conversion cases, interval-only output sweep, forged-result
      # rejection, modern-candidate agreement. No sealed data needed.
      # Verbatim quote-vs-snapshot and real-measurement coverage lives
      # in test_tj0171_dayun_classical_sealed.py (offline acceptance
      # only, NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0171_dayun_classical.py' -v
      # TJ-017.4 dayun composition public contracts: Golden hand-derived
      # case transcription, the composition's first three stages
      # (calendar/direction/measurement/conversion) vs Golden stage
      # values, and fail-closed refusals. The full composition incl.
      # the sequence stage lives in test_tj0174_dayun_compose_sealed.py
      # (offline acceptance only, NOT public CI, same partition rule:
      # the sequence stage needs assembled canonical foundations).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0174_dayun_compose.py' -v
      - run: python scripts/audit_public_asset_changes.py --inventory
