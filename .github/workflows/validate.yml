      # (44 notes untouched), source census unchanged (101).
      # Snapshot-verbatim checks live in
      # test_tj018b_sanming_sanxing_sealed.py (offline acceptance
      # only, NOT public CI: it reads the sealed snapshot files).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj018b_sanming_sanxing.py' -v
      # TJ-018-C sanming juan2 hehua collation register (same
      # register as TJ-018-A/B, continuation volume) public contracts:
      # pure-data register mirrored against Golden, collation-note
      # form and confirmed anchor rule, PUA 6 (gua/yang/yin/jin/xuan)
      # and fang 3 (all read hui) pinned, stem/branch-slot glyph
      # dispositions (shu 14, si 42 stem-slot readings of 82 si
      # positions fully partitioned), transformation-condition
      # variants in conflict with no adjudication (prose month
      # conditions vs monthly table states, divergence pinned),
      # stem five-combination fact linkage matching the code with
      # adjudication semantics unchanged, 018-A/B register
      # regression (44 + 35 notes untouched), source census
      # unchanged (101). Snapshot-verbatim checks live in
