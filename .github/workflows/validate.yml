name: Validate Public Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -p 'test_public_asset_changes.py'
      - run: python -m unittest discover -s tests -p 'test_public_knowledge_boundary.py'
      - run: python -m unittest discover -s tests -p 'test_public_web_bundle.py'
      - run: python -m unittest discover -s tests -p 'test_offline_acceptance.py'
      - run: python -m unittest discover -s tests -p 'test_health_check.py' -v
      # Pure narrative parser regression: no private Canonical/RAG data required.
      # This MUST execute test assertions, not just compileall.
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b004_public_parser_contract.py' -v
      # B012 public execution gate + projection contract: no private
      # Canonical/RAG data required. This MUST execute test assertions,
      # not just compileall. Real-engine tests live in
      # test_b012_tools_engine.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b012_tools_public.py' -v
      # B014 public execution gate + projection contract for ziwei/qimen/
      # fengshui: same rule. Real-engine tests live in
      # test_b014_tools_engine.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b014_tools_public.py' -v
      # B016 admin read-scope decision matrix (pure stdlib, no FastAPI or
      # private data). HTTP-level verification lives in
      # test_b016_admin_scope_http.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b016_admin_scope.py' -v
      # B016 Scenario gate tables pinned to reality (registry ids, router
      # routes, spec files on disk). Pure file parsing, no data required.
      - run: python -m unittest discover -s tests -p 'test_b016_scenario_gate_table.py' -v
      # B018 admin role decision matrix + append-only audit log (pure
      # stdlib, no FastAPI or private data). HTTP-level verification
      # lives in test_b018_admin_roles_http.py (offline acceptance only,
      # NOT public CI). Also includes the read-token env-fallback fix
      # regression (env-configured tokens must authenticate).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b018_admin_roles.py' -v
      # B020 draft approval state machine + action-to-role mapping
      # (pure stdlib, no FastAPI or private data). HTTP-level
      # verification lives in test_b020_drafts_http.py (offline
      # acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b020_drafts.py' -v
      # B018 dream demand matrix view contract (pure file parsing of the
      # DreamCulturePage matrix section, no backend or data required).
      - run: python -m unittest discover -s tests -p 'test_b018_dream_matrix.py' -v
      - run: python scripts/audit_public_asset_changes.py --inventory
