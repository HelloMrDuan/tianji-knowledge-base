name: Validate Public Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -p 'test_public_asset_changes.py'
      - run: python -m unittest discover -s tests -p 'test_public_knowledge_boundary.py'
      - run: python -m unittest discover -s tests -p 'test_public_web_bundle.py'
      - run: python -m unittest discover -s tests -p 'test_offline_acceptance.py'
      - run: python -m unittest discover -s tests -p 'test_health_check.py' -v
      # Pure narrative parser regression: no private Canonical/RAG data required.
      # This MUST execute test assertions, not just compileall.
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b004_public_parser_contract.py' -v
      # B012 public execution gate + projection contract: no private
      # Canonical/RAG data required. This MUST execute test assertions,
      # not just compileall. Real-engine tests live in
      # test_b012_tools_engine.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b012_tools_public.py' -v
      # B014 public execution gate + projection contract for ziwei/qimen/
      # fengshui: same rule. Real-engine tests live in
      # test_b014_tools_engine.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b014_tools_public.py' -v
      # B016 admin read-scope decision matrix (pure stdlib, no FastAPI or
      # private data). HTTP-level verification lives in
      # test_b016_admin_scope_http.py (offline acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b016_admin_scope.py' -v
      # B016 Scenario gate tables pinned to reality (registry ids, router
      # routes, spec files on disk). Pure file parsing, no data required.
      - run: python -m unittest discover -s tests -p 'test_b016_scenario_gate_table.py' -v
      # B018 admin role decision matrix + append-only audit log (pure
      # stdlib, no FastAPI or private data). HTTP-level verification
      # lives in test_b018_admin_roles_http.py (offline acceptance only,
      # NOT public CI). Also includes the read-token env-fallback fix
      # regression (env-configured tokens must authenticate).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b018_admin_roles.py' -v
      # B020 draft approval state machine + action-to-role mapping
      # (pure stdlib, no FastAPI or private data). HTTP-level
      # verification lives in test_b020_drafts_http.py (offline
      # acceptance only, NOT public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b020_drafts.py' -v
      # B022 draft version snapshots + rollback (pure stdlib, no
      # FastAPI or private data). HTTP-level verification lives in
      # test_b022_rollback_http.py (offline acceptance only, NOT
      # public CI).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_b022_rollback.py' -v
      # B018 dream demand matrix view contract (pure file parsing of the
      # DreamCulturePage matrix section, no backend or data required).
      - run: python -m unittest discover -s tests -p 'test_b018_dream_matrix.py' -v
      # F-1 timezone-aware birth calendar (lunar-python + zoneinfo only,
      # no private data or sealed runtime; scenario end-to-end coverage
      # lives in test_tz_scenario_offline.py, offline acceptance only).
      # F-1 test imports the production calendar library, which the code
      # job otherwise never installs (first CI test to import lunar_python).
      - run: python -m pip install 'lunar-python==1.4.8'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tz_birth_calendar.py' -v
      # TJ-031.6 solar-term attribution regression: year/month pillars and
      # solar_term_started_at follow the birth instant against the
      # provider's China-baseline jieqi table (expected values derived
      # independently via sxtwl/JPL anchors in tj0316-verify, NOT from
      # the code under test). Same partition as the F-1 test above.
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tz_solar_term_instant.py' -v
      # TJ-031.7 honest boundaries: 1900-1948 public-period gate
      # helpers + solar-term precision note. Same partition as the tz
      # tests above (lunar-python + zoneinfo + public_projection
      # only; HTTP wiring is exercised in offline acceptance).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0317_honest_boundaries.py' -v
      # TJ-031.5 public labeling contracts: evidence excerpt flags,
      # liuyao judgment scope annotation, dream source title resolved
      # from evidence records. Pure projection/record units (no
      # FastAPI, no private data); handler end-to-end coverage with
      # real records lives in test_public_dream_culture_api.py
      # (offline acceptance only, same partition rule as above).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0315_public_labels.py' -v
      # TJ-013.1 tiaohou (调候) public contracts: rule table vs Golden
      # transcription, pure lookup, engine research gate, forged-trace
      # rejection, public-projection strip. No sealed data needed.
      # Verbatim quote-vs-snapshot and real-chart coverage lives in
      # test_tj0131_tiaohou_sealed.py (offline acceptance only, NOT
      # public CI, same partition rule as the liuyao precedent).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0131_tiaohou.py' -v
      # TJ-013 bingyao (病药) public contracts: rule table vs Golden
      # transcription, pure lookup, never-a-verdict sweep, engine
      # research gate, forged-trace rejection, public-projection strip.
      # No sealed data needed. Verbatim quote-vs-snapshot and real-chart
      # coverage lives in test_tj013_bingyao_sealed.py (offline
      # acceptance only, NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj013_bingyao.py' -v
      # TJ-013.2 (cross-system conflict presentation; stage 2 adds
      # dual-pair relation classification) public
      # contracts: Golden transcription, presenter relation taxonomy
      # over real tiaohou/bingyao lookups, forbidden-key sweep, engine
      # research gate, chart variant-combination gate, public-projection
      # strip. The strength statements fed to the presenter here are
      # synthetic (marked in the test); real-chart coverage with the
      # executed strength verdicts lives in
      # test_tj0132_conflict_presentation_sealed.py (offline acceptance
      # only, NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0132_conflict_presentation.py' -v
      # TJ-013.3 (xiyong readable hints; conflict section synced to
      # TJ-013.2 stage-2 dual-pair classification) public contracts:
      # hand-written Golden text vs deterministic template rendering
      # over real tiaohou/bingyao lookups and the real presenter,
      # fact-closure sweep (line stems subset of input fact stems),
      # banned-vocabulary sweep, fail-closed gates, engine research
      # gate, chart variant-combination gate, public-projection strip.
      # The strength statements fed to the renderer here are synthetic
      # (marked in the test); real-chart coverage with the executed
      # strength verdicts lives in
      # test_tj0133_readable_hints_sealed.py (offline acceptance only,
      # NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0133_readable_hints.py' -v
      # TJ-017.1 dayun classical-evidence public contracts: rule/quote
      # tables vs Golden transcription, text-derived direction and
      # conversion cases, interval-only output sweep, forged-result
      # rejection, modern-candidate agreement. No sealed data needed.
      # Verbatim quote-vs-snapshot and real-measurement coverage lives
      # in test_tj0171_dayun_classical_sealed.py (offline acceptance
      # only, NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0171_dayun_classical.py' -v
      # TJ-017.4 dayun composition public contracts: Golden hand-derived
      # case transcription, the composition's first three stages
      # (calendar/direction/measurement/conversion) vs Golden stage
      # values, and fail-closed refusals. The full composition incl.
      # the sequence stage lives in test_tj0174_dayun_compose_sealed.py
      # (offline acceptance only, NOT public CI, same partition rule:
      # the sequence stage needs assembled canonical foundations).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0174_dayun_compose.py' -v
      # TJ-017.3 dayun timeline view public contracts: Golden view
      # expectations vs the TJ-017.4 Golden transcription, view
      # transform fidelity over fixtures assembled from the real
      # first three stages plus Golden sequence rows (fixture
      # honesty stated in the test), method-switch invariance,
      # empty-state catalogue, forbidden-field sweep, fail-closed
      # rejection, public-projection strip. End-to-end coverage
      # against live composition results lives in
      # test_tj0173_dayun_timeline_view_sealed.py (offline acceptance
      # only, NOT public CI, same partition rule).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0173_dayun_timeline_view.py' -v
      # TJ-012.3 Slice A luren route public contracts: registered
      # 禄/刃 table vs Golden transcription, full stem x branch route
      # sweep, determination-None sweep, forged-trace rejection,
      # engine gate and projection strip. Verbatim quote equality
      # against the snapshots and real-chart coverage live in
      # test_tj012_luren_route_sealed.py (offline acceptance only,
      # NOT public CI: pattern candidates need sealed Canonical data).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj012_luren_route.py' -v
      # TJ-012.3 Slice B zaqi selection public contracts: registered
      # quotes vs Golden transcription, pure selection lookup branch
      # coverage （戊己透出/弃判、一般臂不换算、非杂气月不适用）,
      # determination-None sweep, forged-trace rejection, engine gate
      # and projection strip. Verbatim quote equality against the
      # snapshots and real-chart coverage live in
      # test_tj012_zaqi_selection_sealed.py (offline acceptance only,
      # NOT public CI: pattern candidates need sealed Canonical data).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj012_zaqi_selection.py' -v
      # TJ-012.3 Slice C step 1 siling conflict matrix public contracts:
      # pure-data registration mirrored against Golden, five versions
      # present and pairwise distinct, T1/T2 registered separately with
      # T2 arithmetic errors preserved verbatim (酉 32 / 子 26),
      # dissent recorded, shenfeng unrecoverable, qiongtong absent,
      # adjudication-status full sweep (conflict except the authorized
      # 寅月 Ren-branch pilot cell), unified-table forbidden-key sweep,
      # layer attribution （原注 vs 任氏曰） and calculation_convention
      # pins. Verbatim quote equality against the snapshots lives in
      # test_tj012_siling_matrix_sealed.py (offline acceptance only,
      # NOT public CI: it reads the sealed snapshot files).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj012_siling_matrix.py' -v
      # TJ-012.3 Slice C step 2 yin-month siling pilot public contracts:
      # hand-derived Golden boundary table (±1s at lichun / day-7 /
      # day-14 / next jie, cross-timezone same instant, DST-era elapsed
      # vs naive date subtraction), registration-consumption pins
      # (segment bounds parsed from the registered convention,
      # disclaimer verbatim, tampered registration fails closed),
      # non-pilot versions and non-yin inputs never masquerading as
      # pilot results, forged/uncertain inputs failing closed,
      # determination-None and forbidden-key sweeps, projection strip.
      # The pilot replays Jie instants from the pinned provider
      # (lunar-python installed above). Snapshot-verbatim quote checks
      # and assembled-env replay live in
      # test_tj012_siling_pilot_sealed.py (offline acceptance only,
      # NOT public CI: it reads the sealed snapshot files).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj012_siling_pilot.py' -v
      # TJ-018-A sanming juan2 collation register public contracts:
      # pure-data register mirrored against Golden, collation-note
      # form (required fields, status/disposition enums, confirmed
      # requires >=2 witness/corroboration anchors, unresolved has
      # reading=None, readings carry no PUA), fang three-way
      # accounting (10 corrected + 1 genuine), fire-scout named
      # glyph corrections pinned, ding-changsheng conflict with two
      # unadjudicated branches, ten-stem coverage complete,
      # source census unchanged (101). Verbatim quote equality and
      # full glyph scans against the snapshots live in
      # test_tj018a_sanming_juan2_sealed.py (offline acceptance only,
      # NOT public CI: it reads the sealed snapshot files).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj018a_sanming_juan2.py' -v
      # TJ-018-B sanming juan2 sanxing collation register (same
      # register as TJ-018-A, continuation volume) public contracts:
      # pure-data register mirrored against Golden, collation-note
      # form and confirmed anchor rule, PUA 8 (tuan/dai/xuan) and
      # fang 5 readings pinned, branch-slot glyph dispositions
      # (shu 8 read xu, ji 2 read si), one unresolved and one
      # suspected entry pinned, naming variants in conflict with
      # no adjudication, three-punishments concept linkage matching
      # the adjudication code verbatim, 018-A register regression
      # (44 notes untouched), source census unchanged (101).
      # Snapshot-verbatim checks live in
      # test_tj018b_sanming_sanxing_sealed.py (offline acceptance
      # only, NOT public CI: it reads the sealed snapshot files).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj018b_sanming_sanxing.py' -v
      # TJ-018-C sanming juan2 hehua collation register (same
      # register as TJ-018-A/B, continuation volume) public contracts:
      # pure-data register mirrored against Golden, collation-note
      # form and confirmed anchor rule, PUA 6 (gua/yang/yin/jin/xuan)
      # and fang 3 (all read hui) pinned, stem/branch-slot glyph
      # dispositions (shu 14, si 42 stem-slot readings of 82 si
      # positions fully partitioned), transformation-condition
      # variants in conflict with no adjudication (prose month
      # conditions vs monthly table states, divergence pinned),
      # stem five-combination fact linkage matching the code with
      # adjudication semantics unchanged, 018-A/B register
      # regression (44 + 35 notes untouched), source census
      # unchanged (101). Snapshot-verbatim checks live in
      # test_tj018c_sanming_hehua_sealed.py (offline acceptance
      # only, NOT public CI: it reads the sealed snapshot files).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj018c_sanming_hehua.py' -v
      # TJ-011.2 fire morphology adjudication public contracts:
      # pure-data design register (zero functions), ten Ditiansui
      # definition/root quotes with self-consistent locators and layer
      # attribution, Bing root positions with pinned evidence grades
      # (Wu stays framework_derived, never per-stem listed), nine form
      # conditions with honest anchor typing (governance conventions
      # labeled non-original), Zi weak form not_buildable with the
      # Wuhudun proof intact, Ding blocked by the same conflict id as
      # TJ-018-A, and four hand-derived Golden design cases whose
      # expectations agree with their own condition tables.
      # Snapshot-verbatim quote checks and production-calendar pillar
      # replay live in test_tj0112_fire_morphology_sealed.py (offline
      # acceptance only, NOT public CI: it reads the sealed snapshot
      # files and runs the assembled engine).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0112_fire_morphology.py' -v
      # TJ-011.2 Bing x Wu commanding predicate public contracts:
      # implementation anchor-provenance map keyed exactly by the
      # morphology register's nine conditions (governance-convention
      # conditions never relabelled original text), batch Golden design
      # quartet tables identical to the design batch's, failed sets
      # self-consistent, chart-unrealizable designs registered.
      # Chart execution against the sealed policy and production
      # calendar lives in test_tj0112_bing_wu_commanding.py (offline
      # acceptance only, NOT public CI: it needs the sealed snapshot).
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_tj0112_bing_wu_public.py' -v
      - run: python scripts/audit_public_asset_changes.py --inventory
