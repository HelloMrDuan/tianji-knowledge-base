name: Refresh Audited Knowledge Files

on:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/rebuild_derived.py"
      - "scripts/audit_yijing_variants.py"
      - "scripts/refresh_manifest_sources.py"
      - "config/source_file_manifest.json"
      - ".github/workflows/refresh-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-kb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e ".[validation,calendar,api]"
      - name: Refresh whitelisted upstream files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_manifest_sources.py
      - name: Cross-check Yijing sources without overwriting canonical
        run: python scripts/audit_yijing_variants.py
      - name: Validate protected knowledge base
        run: |
          export PYTHONPATH=src
          python scripts/validate_kb.py
          python scripts/validate_knowledge.py
          python scripts/build_production_runtime.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_index.py
      - name: Commit audited refresh
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "tianji-kb-bot"
          git config user.email "tianji-kb-bot@users.noreply.github.com"
          git add data/upstream data/quarantine data/reference data/index data/state data/audit
          git commit -m "chore: refresh and rebuild audited knowledge base"
          git pull --rebase origin main
          git push origin main
