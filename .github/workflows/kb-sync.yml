name: KB Source Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: |
          export PYTHONPATH=src
          python scripts/validate_kb.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Sync upstream metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PYTHONPATH=src
          python scripts/sync_sources.py
      - name: Commit state refresh
        shell: bash
        run: |
          if git diff --quiet -- data/state; then exit 0; fi
          git config user.name "tianji-kb-bot"
          git config user.email "tianji-kb-bot@users.noreply.github.com"
          git add data/state
          git commit -m "chore: sync upstream source metadata"
          git push
