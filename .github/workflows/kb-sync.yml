name: KB Source Metadata Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-public-source-metadata
  cancel-in-progress: false

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Public Actions must never ingest or commit canonical/quarantine bytes.
      - name: Refresh upstream commit and license metadata only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=src python scripts/sync_sources.py

      - name: Stage and audit metadata-only update
        shell: bash
        run: |
          git add -- data/state/source_state.json
          python scripts/public_knowledge_boundary.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "tianji-kb-bot"
          git config user.email "tianji-kb-bot@users.noreply.github.com"
          git commit -m "chore: refresh upstream source metadata only"
          git pull --rebase origin main
          git push origin main
