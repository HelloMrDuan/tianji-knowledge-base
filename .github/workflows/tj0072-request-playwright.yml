name: TJ-007.2 Request Contracts Playwright

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tj0072-request-playwright.yml"
      - "web/visual-prototype/**"
      - "docs/product/TASK_STATUS.md"
      - "docs/product/TASK_HISTORY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/visual-prototype/package-lock.json
      - name: Install frontend
        working-directory: web/visual-prototype
        run: npm ci
      - name: Install Chromium
        working-directory: web/visual-prototype
        run: npx playwright install --with-deps chromium
      - name: Verify real browser request parameters (aborted API, NOT a calculation test)
        working-directory: web/visual-prototype
        run: CI=true npm test -- tests/tj0072-scenarios.spec.ts
