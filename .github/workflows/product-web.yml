name: Validate Product Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare real deterministic API
        run: |
          python -m pip install -e ".[validation,calendar,api]"
          PYTHONPATH=src python scripts/build_production_runtime.py
          PYTHONPATH=src uvicorn tianji_kb.api:app --host 127.0.0.1 --port 8000 >/tmp/tianji-api.log 2>&1 &
          echo $! >/tmp/tianji-api.pid

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/visual-prototype/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/visual-prototype
        run: npm ci

      - name: Typecheck and build
        working-directory: web/visual-prototype
        run: npm run build

      - name: Start frontend with API proxy
        working-directory: web/visual-prototype
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/tianji-web.log 2>&1 &
          echo $! >/tmp/tianji-web.pid

      - name: Verify real frontend-to-API product flows
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:5173/api/v1/execute             -H 'Content-Type: application/json'             -d '{"domain":"liuyao","variant":"jingfang-eight-palaces-v1","input":{"value":"2000-01-07T12:00:00+08:00","yao_values":[9,7,7,7,7,7]},"explain":false,"mode":"production"}'             >/tmp/liuyao.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/liuyao.json",encoding="utf-8"))
          assert data["domain"]=="liuyao"
          assert data["variant"]=="jingfang-eight-palaces-v1"
          assert data["deterministic"] is True
          assert data["chart"]["changing_lines"]==[1]
          assert data["chart"]["changed"]["number"]==44
          assert data["evidence"]
          assert data["explanation_status"]=="disabled"
          print("real frontend proxy -> API -> deterministic Liuyao: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/execute \
            -H 'Content-Type: application/json' \
            -d '{"domain":"bazi","variant":"ziping-structural-v1","input":{"value":"2000-01-07T12:00:00+08:00"},"explain":false,"mode":"production"}' \
            >/tmp/bazi.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bazi.json",encoding="utf-8"))
          assert data["domain"]=="bazi"
          assert data["variant"]=="ziping-structural-v1"
          assert data["deterministic"] is True
          assert data["chart"]["day_master"]["stem"]=="甲"
          assert len(data["chart"]["pillars"])==4
          assert data["evidence"]
          assert data["explanation_status"]=="disabled"
          print("real frontend proxy -> API -> deterministic Bazi: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"yearly","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_year":2026}}' \
            >/tmp/yearly.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/yearly.json",encoding="utf-8"))
          assert data["scenario_id"]=="yearly"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["target_year"]["ganzhi"]=="丙午"
          assert data["result"]["target_year"]["stem_ten_god"]=="食神"
          assert data["evidence"]
          assert data["limitations"]
          print("real frontend proxy -> Scenario Engine -> 2026 annual structure: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"romance","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_year":2026}}' \
            >/tmp/romance.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/romance.json",encoding="utf-8"))
          assert data["scenario_id"]=="romance"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["release_scope"]=="xianchi_structure_only"
          assert data["result"]["xianchi"]["basis_policy"]=="year_and_day_reported_separately"
          assert set(data["result"]["target_year_activation"])=={"year_branch_basis","day_branch_basis"}
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("romance_score","marriage_score","fortune_score","auspicious"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> romance structure: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"career","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_year":2026}}' \
            >/tmp/career.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/career.json",encoding="utf-8"))
          assert data["scenario_id"]=="career"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["release_scope"]=="career_wealth_structure_only"
          assert data["result"]["target_year"]["ganzhi"]=="丙午"
          assert data["result"]["target_year"]["stem_ten_god"]=="食神"
          assert data["result"]["target_year"]["structure_group"]=="output"
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("career_score","wealth_score","income","investment_advice","auspicious"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> career wealth structure: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"life","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_year":2026}}' \
            >/tmp/life.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/life.json",encoding="utf-8"))
          assert data["scenario_id"]=="life"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["report_version"]=="life-overview-v1"
          assert data["result"]["yearly"]["target_year"]["ganzhi"]=="丙午"
          assert {x["id"] for x in data["result"]["highlights"]}=={"foundation","yearly","romance","career"}
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("fortune_score","romance_score","career_score","wealth_score","investment_advice","auspicious"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> life overview: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"daily","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_date":"2026-10-04"}}' \
            >/tmp/daily.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/daily.json",encoding="utf-8"))
          assert data["scenario_id"]=="daily"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["release_scope"]=="daily_structure_only"
          assert data["result"]["target_day"]["date"]=="2026-10-04"
          assert len(data["result"]["target_day"]["ganzhi"])==2
          assert data["result"]["target_day"]["stem_ten_god"]
          assert set(data["result"]["xianchi"]["target_day_activation"])=={"year_branch_basis","day_branch_basis"}
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("fortune_score","daily_score","investment_advice","health_advice","auspicious"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> daily structure: ok")
          PY


          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"weekly","input":{"birth_value":"2000-01-07T12:00:00+08:00","anchor_date":"2026-10-04"}}' \
            >/tmp/weekly.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/weekly.json",encoding="utf-8"))
          assert data["scenario_id"]=="weekly"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["release_scope"]=="weekly_structure_only"
          assert data["result"]["week"]["start_date"]=="2026-09-28"
          assert data["result"]["week"]["end_date"]=="2026-10-04"
          assert len(data["result"]["week"]["days"])==7
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("fortune_score","weekly_score","auspicious","investment_advice"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> weekly structure: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"monthly","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_month":"2026-10"}}' \
            >/tmp/monthly.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/monthly.json",encoding="utf-8"))
          assert data["scenario_id"]=="monthly"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["release_scope"]=="monthly_structure_only"
          assert data["result"]["month"]["target_month"]=="2026-10"
          assert data["result"]["month"]["day_count"]==31
          assert len(data["result"]["month"]["days"])==31
          assert sum(data["result"]["summary"]["structure_group_counts"].values())==31
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("fortune_score","monthly_score","auspicious","investment_advice"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> monthly structure: ok")
          PY


          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"compatibility","input":{"person_a_birth_value":"2000-01-07T12:00:00+08:00","person_b_birth_value":"2000-01-07T18:00:00+08:00"}}' \
            >/tmp/compatibility.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/compatibility.json",encoding="utf-8"))
          assert data["scenario_id"]=="compatibility"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["release_scope"]=="two_person_structure_only"
          assert data["result"]["day_master_relations"]["a_sees_b"]["ten_god"]=="比肩"
          assert data["result"]["day_master_relations"]["b_sees_a"]["ten_god"]=="比肩"
          assert set(data["result"]["xianchi_cross_matches"])=={"a_targets_vs_b","b_targets_vs_a"}
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("compatibility_score","match_score","love_score","marriage_score","auspicious","breakup_risk"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> compatibility structure: ok")
          PY

      - name: Existing frontend browser regression
        working-directory: web/visual-prototype
        run: |
          npx playwright install --with-deps chromium
          npm test
