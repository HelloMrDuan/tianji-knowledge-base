name: Validate Product Web

on:
  pull_request:
    branches: [main]
    paths:
      - "web/visual-prototype/**"
      - ".github/workflows/product-web.yml"
  push:
    branches: [main]
    paths:
      - "web/visual-prototype/**"
      - ".github/workflows/product-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/visual-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/visual-prototype/package-lock.json
      - run: npm ci
      - run: npm run build
