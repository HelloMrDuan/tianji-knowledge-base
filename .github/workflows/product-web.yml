name: Validate Product Web

on:
  pull_request:
    branches: [main]
    paths:
      - "web/visual-prototype/**"
      - ".github/workflows/product-web.yml"
  push:
    branches: [main]
    paths:
      - "web/visual-prototype/**"
      - ".github/workflows/product-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare real deterministic API
        run: |
          python -m pip install -e ".[validation,calendar,api]"
          PYTHONPATH=src python scripts/build_production_runtime.py
          PYTHONPATH=src uvicorn tianji_kb.api:app --host 127.0.0.1 --port 8000 >/tmp/tianji-api.log 2>&1 &
          echo $! >/tmp/tianji-api.pid

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/visual-prototype/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/visual-prototype
        run: npm ci

      - name: Typecheck and build
        working-directory: web/visual-prototype
        run: npm run build

      - name: Start frontend with API proxy
        working-directory: web/visual-prototype
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/tianji-web.log 2>&1 &
          echo $! >/tmp/tianji-web.pid

      - name: Verify real frontend-to-API product flows
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:5173/api/v1/execute             -H 'Content-Type: application/json'             -d '{"domain":"liuyao","variant":"jingfang-eight-palaces-v1","input":{"value":"2000-01-07T12:00:00+08:00","yao_values":[9,7,7,7,7,7]},"explain":false,"mode":"production"}'             >/tmp/liuyao.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/liuyao.json",encoding="utf-8"))
          assert data["domain"]=="liuyao"
          assert data["variant"]=="jingfang-eight-palaces-v1"
          assert data["deterministic"] is True
          assert data["chart"]["changing_lines"]==[1]
          assert data["chart"]["changed"]["number"]==44
          assert data["evidence"]
          assert data["explanation_status"]=="disabled"
          print("real frontend proxy -> API -> deterministic Liuyao: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/execute \
            -H 'Content-Type: application/json' \
            -d '{"domain":"bazi","variant":"ziping-structural-v1","input":{"value":"2000-01-07T12:00:00+08:00"},"explain":false,"mode":"production"}' \
            >/tmp/bazi.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/bazi.json",encoding="utf-8"))
          assert data["domain"]=="bazi"
          assert data["variant"]=="ziping-structural-v1"
          assert data["deterministic"] is True
          assert data["chart"]["day_master"]["stem"]=="甲"
          assert len(data["chart"]["pillars"])==4
          assert data["evidence"]
          assert data["explanation_status"]=="disabled"
          print("real frontend proxy -> API -> deterministic Bazi: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"yearly","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_year":2026}}' \
            >/tmp/yearly.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/yearly.json",encoding="utf-8"))
          assert data["scenario_id"]=="yearly"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["target_year"]["ganzhi"]=="丙午"
          assert data["result"]["target_year"]["stem_ten_god"]=="食神"
          assert data["evidence"]
          assert data["limitations"]
          print("real frontend proxy -> Scenario Engine -> 2026 annual structure: ok")
          PY

          curl -fsS -X POST http://127.0.0.1:5173/api/v1/scenarios/execute \
            -H 'Content-Type: application/json' \
            -d '{"scenario_id":"romance","input":{"birth_value":"2000-01-07T12:00:00+08:00","target_year":2026}}' \
            >/tmp/romance.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/romance.json",encoding="utf-8"))
          assert data["scenario_id"]=="romance"
          assert data["status"]=="production_limited"
          assert data["public_release"] is False
          assert data["deterministic"] is True
          assert data["result"]["release_scope"]=="xianchi_structure_only"
          assert data["result"]["xianchi"]["basis_policy"]=="year_and_day_reported_separately"
          assert set(data["result"]["target_year_activation"])=={"year_branch_basis","day_branch_basis"}
          assert data["evidence"]
          blob=str(data["result"])
          for forbidden in ("romance_score","marriage_score","fortune_score","auspicious"):
              assert forbidden not in blob
          print("real frontend proxy -> Scenario Engine -> romance structure: ok")
          PY
