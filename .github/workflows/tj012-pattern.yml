name: TJ-012 Pattern Safety Gate

# Public CI role: code compilation + safety gate ONLY.
# Full pattern tests (test_phase2_bazipattern.py) require private Canonical
# knowledge data that MUST NOT be in the public repo. They run in the
# private repo's TJ-012.2 acceptance workflow instead.
# This gate MUST NOT be described as "pattern tests passed".

on:
  push:
    branches: [main]
    paths:
      - 'src/tianji_kb/bazi_pattern.py'
      - 'tests/test_phase2_bazipattern.py'
      - '.github/workflows/tj012-pattern.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/tianji_kb/bazi_pattern.py'
      - 'tests/test_phase2_bazipattern.py'
      - '.github/workflows/tj012-pattern.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern-safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pattern code and tests
        run: |
          set -euo pipefail
          python -m compileall -q src/tianji_kb/bazi_pattern.py tests/test_phase2_bazipattern.py
          echo "Pattern code compiles OK"
      - name: Verify no private knowledge data in public repo
        run: |
          set -euo pipefail
          # Private Canonical files must never enter the public repo
          if find . -path ./.git -prune -o -name 'foundations_v1.json' -print | grep -q .; then
            echo "ERROR: foundations_v1.json found in public repo - private data leak"
            exit 1
          fi
          echo "No private canonical data detected"
      - name: Verify counterexample assertions are real (not fake-pass)
        run: |
          set -euo pipefail
          # The TJ-012.2 tests must assert real counterexample IDs,
          # not merely 'pattern_candidates' existence.
          if grep -q "assertIn('pattern_candidates', result)" tests/test_phase2_bazipattern.py; then
            echo "ERROR: Fake-pass assertion pattern detected in pattern tests"
            exit 1
          fi
          for cid in xin_exposed_contradicts_unexposed_branch non_jia_day_contradicts_jia_branch no_month_hidden_official_contradicts_restriction_branch; do
            if ! grep -q "$cid" tests/test_phase2_bazipattern.py; then
              echo "ERROR: Counterexample test for $cid missing"
              exit 1
            fi
          done
          echo "Counterexample test assertions verified present"
      - name: Note full acceptance runs in private CI
        run: |
          echo "NOTE: This is a safety gate only."
          echo "Full pattern tests run in the private repo TJ-012.2 acceptance workflow."
          echo "Do NOT treat this green check as pattern test acceptance."
