name: TJ-012 Pattern Counterexamples

on:
  push:
    branches: [main]
    paths:
      - 'src/tianji_kb/bazi_pattern.py'
      - 'tests/test_phase2_bazipattern.py'
      - '.github/workflows/tj012-pattern.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/tianji_kb/bazi_pattern.py'
      - 'tests/test_phase2_bazipattern.py'
      - '.github/workflows/tj012-pattern.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[calendar,api,validation]' || \
            python -m pip install fastapi httpx pydantic jsonschema lunar-python
      - name: Run pattern counterexample tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_phase2_bazipattern.py' -v 2>&1 | tee /tmp/pattern_test.log
          echo "--- Test summary ---"
          grep -E "^(OK|FAILED|Ran )" /tmp/pattern_test.log
          # Fail if any test failed or errored - do not rely on grep alone
          if grep -qE "^(FAILED|ERROR)" /tmp/pattern_test.log; then
            echo "PATTERN TESTS FAILED - see log above"
            exit 1
          fi
      - name: Verify no skipped pattern tests counted as pass
        run: |
          set -euo pipefail
          if grep -qiE "skipped=[1-9]|OK \(skipped=" /tmp/pattern_test.log; then
            echo "ERROR: Some pattern tests were skipped - not acceptable as pass"
            grep -i "skipped" /tmp/pattern_test.log || true
            exit 1
          fi
          echo "No skipped tests detected" 
