name: TJ-012 Pattern Counterexamples

on:
  push:
    branches: [main]
    paths:
      - 'src/tianji_kb/bazi_pattern.py'
      - 'tests/test_phase2_bazipattern.py'
      - '.github/workflows/tj012-pattern.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/tianji_kb/bazi_pattern.py'
      - 'tests/test_phase2_bazipattern.py'
      - '.github/workflows/tj012-pattern.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[calendar,api,validation]' || \
            python -m pip install fastapi httpx pydantic jsonschema lunar-python
      - name: Run pattern counterexample tests
        run: |
          python -m unittest discover -s tests -p 'test_phase2_bazipattern.py' -v 2>&1 | tee /tmp/pattern_test.log
          echo "--- Test summary ---"
          grep -E "^(OK|FAILED|Ran )" /tmp/pattern_test.log
      - name: Verify no skipped pattern tests counted as pass
        run: |
          if grep -q "skipped" /tmp/pattern_test.log; then
            echo "WARNING: Some tests were skipped"
            grep -i "skipped" /tmp/pattern_test.log
          fi
