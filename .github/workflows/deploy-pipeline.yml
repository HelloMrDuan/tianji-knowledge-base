# Tianji PUBLIC repo deploy pipeline.
# Install as: HelloMrDuan/tianji-knowledge-base/.github/workflows/deploy-pipeline.yml
# Companion file: public-Dockerfile.web, committed at the public repo ROOT
# (this workflow references it as ./public-Dockerfile.web).
#
# Design (see NOTES.md in the deployment workspace):
#   - Every branch push and every PR runs the same validation the public
#     repo already trusts (mirrored from "Validate Public Frontend").
#   - Push events additionally build the public WEB image and push it to
#     GHCR under an immutable per-SHA tag plus a per-branch channel tag.
#   - The sealed API image is NEVER built or pushed here: it contains
#     reviewed private knowledge. Acceptance must run offline on a
#     trusted machine using the existing real acceptance gate.
#     A web image existing in GHCR is NOT a deploy permission.
#     Do not depend on private-repository GitHub Actions or auto-tagging.
#   - This workflow uses no deployment secrets. The only credential is
#     the workflow's own GITHUB_TOKEN, granted packages:write on the
#     build job only, and that job runs on push events of THIS repo
#     (never on pull_request), so fork PRs can never reach it.

name: Deploy Pipeline

on:
  push:
    branches: ['**']
  pull_request:

# Restrictive default; the build job re-declares what it needs.
permissions:
  contents: read

# One run per ref at a time; queued runs are never cancelled so an older
# run can never be silently replaced by a newer one mid-flight.
concurrency:
  group: deploy-tianji-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate public frontend and distribution boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A complete production runtime needs private audited Canonical data
      # and can only be validated in the private sealed acceptance workflow.
      # Public CI must not attempt to manufacture or bypass that data gate.
      # Use the existing public frontend validation contract below.

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/visual-prototype/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/visual-prototype
        run: npm ci

      - name: Typecheck and compile frontend
        working-directory: web/visual-prototype
        run: npm run build

      - name: Reject internal files in public distribution
        run: python scripts/check_public_web_bundle.py web/visual-prototype/dist

  build:
    name: Build and push web image (GHCR)
    # Push events only: PRs (including forks) validate but never publish.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Channel tag: main -> channel-main (stable channel), any other
      # branch -> channel-<slugified branch> (prerelease channel).
      - name: Compute channel tag
        id: channel
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[^a-z0-9_]+//; s/[-._]+$//')"
          test -n "$slug"
          echo "tag=channel-${slug}" >> "$GITHUB_OUTPUT"
          echo "Channel tag: channel-${slug}"

      # Mirror the private sealed-release workflow: the frontend build
      # context is isolated and its .dockerignore excludes everything
      # that must never enter the public web image.
      - name: Isolate frontend build context (.dockerignore)
        run: |
          printf 'node_modules\ndist\n.git\n.env*\ndata\nbuild\n*.map\n' \
            > web/visual-prototype/.dockerignore

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web/visual-prototype
          file: ./public-Dockerfile.web
          push: true
          tags: |
            ghcr.io/hellomrduan/tianji-web:${{ github.sha }}
            ghcr.io/hellomrduan/tianji-web:${{ steps.channel.outputs.tag }}

  # Deployment handoff: this image alone never deploys Tianji. The
  # trusted-machine offline acceptance must verify the exact public SHA
  # and private snapshot before the on-machine deploy agent can deploy.
  # The agent must fail-closed unless its offline acceptance evidence is
  # valid and current; keep SHA/PIN checks, health gates and rollback. This job performs the OFFICIAL wake-up only: a visit to a
  # published port URL resumes an idle-paused machine. It never fails
  # the pipeline (the public gateway has a small connection budget; a
  # 429 here does not mean the deploy failed).
  wake:
    name: wake-machine
    needs: build
    # Only the verified main channel may wake the production machine.
    # Feature branches may build test images, never touch the live machine.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Visit published URL to resume the machine (official wake)
        run: |
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://8080-agqwnq7rh7fahkx2dsyymvvdsu.instabox.tech/ || true)"
            echo "wake attempt $i -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
          echo "Image publication is not deployment. Trusted-machine offline sealed acceptance is required before release of public SHA ${{ github.sha }}."

  # Branch resume (NOT a deployment): a push to a non-main branch only
  # visits the published URL to resume an idle-paused machine, so the
  # on-machine timer + deploy agent can reconcile preview channels.
  # Resume != deploy: the agent alone decides deployments under channel
  # rules (stable accepts main only; previews are isolated web-only
  # containers on their own loopback ports). This preserves #313's
  # division: branches never touch the stable service; they only wake
  # the machine for their own preview channel. No deployment secrets.
  preview-resume:
    name: resume-machine-for-preview
    needs: build
    # Non-main pushes only; main keeps its own wake job above.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Visit published URL to resume the machine (resume only, not a deploy)
        run: |
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://8080-agqwnq7rh7fahkx2dsyymvvdsu.instabox.tech/ || true)"
            echo "preview resume attempt $i -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
          echo "Resume only, not a deployment. Preview deployment is decided on-machine by the deploy agent under channel rules; CI green, image pushed and wake success are not deployment."