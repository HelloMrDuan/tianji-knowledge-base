name: Bootstrap Tianji Knowledge Base

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand repository seed
        run: python bootstrap.py
      - name: Validate canonical data
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_kb.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_index.py
      - name: Commit generated repository
        shell: bash
        run: |
          git config user.name "tianji-kb-bot"
          git config user.email "tianji-kb-bot@users.noreply.github.com"
          git rm -f bootstrap.py .github/workflows/bootstrap.yml
          git add -A
          git commit -m "feat: bootstrap provenance-first Tianji knowledge base"
          git push origin main
